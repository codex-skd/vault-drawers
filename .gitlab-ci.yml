stages:
  - validate
  - build
  - test
  - deploy

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3G"

before_script:
  - chmod +x gradlew

validate:
  stage: validate
  script:
    - ./gradlew --version
    - ./gradlew checkstyleMain || true
  tags:
    - java

build:
  stage: build
  script:
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week
  tags:
    - java

test:
  stage: test
  script:
    - ./gradlew test
  tags:
    - java

deploy_curseforge:
  stage: deploy
  image: curlimages/curl:latest
  variables:
    # Set in GitLab CI/CD variables: CURSEFORGE_API_TOKEN, CURSEFORGE_PROJECT_ID
    JAR_PATH: "build/libs/vault_drawers-26.2-neoforge-26.2.0.57-${MOD_VERSION}.jar"
  script:
    - |
      if [ -z "$CURSEFORGE_API_TOKEN" ] || [ -z "$CURSEFORGE_PROJECT_ID" ]; then
        echo "Missing CURSEFORGE_API_TOKEN or CURSEFORGE_PROJECT_ID variables"
        exit 1
      fi
    - |
      # Extract version from gradle.properties
      MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
      JAR_FILE=$(ls build/libs/vault_drawers-26.2-neoforge-26.2.0.57-${MOD_VERSION}.jar 2>/dev/null | head -1)
      if [ ! -f "$JAR_FILE" ]; then
        echo "JAR not found: $JAR_FILE"
        exit 1
      fi
      echo "Uploading $JAR_FILE to CurseForge project $CURSEFORGE_PROJECT_ID"
    - |
      # Upload to CurseForge API
      curl -X POST "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file" \
        -H "Authorization: Bearer ${CURSEFORGE_API_TOKEN}" \
        -H "Accept: application/json" \
        -F "file=@${JAR_FILE}" \
        -F "metadata={\"gameVersions\":[\"26.2\",\"NeoForge\"],\"releaseType\":\"beta\",\"changelog\":\"$(cat CHANGELOG.md | sed -n '/^## \[0.0.0-beta/,/^## \[/p' | head -n -1 | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')\"}" \
        -w "\nHTTP %{http_code}\n"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v0\.0\.0-beta\./
      when: manual
    - if: $CI_COMMIT_BRANCH == "minecraft/26.2/neoforge-26.2.0.57/production"
      when: manual
  tags:
    - java

# Graphify update (run manually or on schedule)
graphify:
  stage: build
  script:
    - |
      GRAPHIFY="C:\Users\llagu\AppData\Local\Packages\PythonSoftwareFoundation.Python.3.13_qbz5n2kfra8p0\LocalCache\local-packages\Python313\Scripts\graphify.exe"
      "$GRAPHIFY" update . --force
    - git config user.email "ci@stalkingdragons.com"
    - git config user.name "CI Bot"
    - git add graphify-out/
    - git commit -m "chore: update knowledge graph" || true
    - git push || true
  when: manual
  tags:
    - java