stages:
  - validate
  - build
  - test

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3G"

before_script:
  - chmod +x gradlew

validate:
  stage: validate
  script:
    - ./gradlew --version
    - ./gradlew checkstyleMain || true
  tags:
    - java

build:
  stage: build
  script:
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week
  tags:
    - java

test:
  stage: test
  script:
    - ./gradlew test
  tags:
    - java

# Graphify update (run manually or on schedule)
graphify:
  stage: build
  script:
    - |
      GRAPHIFY="C:\Users\llagu\AppData\Local\Packages\PythonSoftwareFoundation.Python.3.13_qbz5n2kfra8p0\LocalCache\local-packages\Python313\Scripts\graphify.exe"
      "$GRAPHIFY" update . --force
    - git config user.email "ci@stalkingdragons.com"
    - git config user.name "CI Bot"
    - git add graphify-out/
    - git commit -m "chore: update knowledge graph" || true
    - git push || true
  when: manual
  tags:
    - java