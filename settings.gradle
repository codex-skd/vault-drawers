pluginManagement {
    repositories {
        mavenCentral()
        maven { url = uri("https://maven.neoforged.net/releases") }
        maven { url = uri("https://maven.neoforged.net/snapshots") }
        maven { url = uri("https://mavendev.modrinth.net") }
        maven { url = uri("https://mvn.modrinth.net") }
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "net.neoforged.moddev") {
                useModule("net.neoforged:neoforged-gradle-plugin:26.2.0.57")
            }
        }
    }
}

rootProject.name = "vault-drawers-26.2"